services:

  mongodb:
    image: mongo:8
    container_name: IEFP_TPSI2526
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
      MONGO_INITDB_DATABASE: aula_IEFP_TPSI2526
    
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: